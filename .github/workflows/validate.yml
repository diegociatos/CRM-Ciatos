name: Validate CRM
on:
  pull_request:
  push:
    branches: [feat/autonomous-crm-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npx deno check supabase/functions/crm-email-open/index.ts supabase/functions/crm-ms365/index.ts supabase/functions/crm-automation-worker/index.ts supabase/functions/crm-email-webhook/index.ts supabase/functions/crm-unsubscribe/index.ts supabase/functions/crm-enrichment/index.ts supabase/functions/crm-ai-supervisor/index.ts supabase/functions/crm-inbound-event/index.ts supabase/functions/crm-admin-users/index.ts supabase/functions/crm-ia/index.ts supabase/functions/crm-mail/index.ts
